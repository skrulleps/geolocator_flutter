name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      tag: ${{ steps.app_version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '[:space:]')"

          if [ -z "$version" ]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi

          echo "App version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Floor database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build-release:
    name: Build Android release (${{ matrix.flavor }})
    needs: [quality, version]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            entrypoint: lib/main_dev.dart
          - flavor: staging
            entrypoint: lib/main_staging.dart
          - flavor: production
            entrypoint: lib/main_production.dart

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Floor database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --flavor ${{ matrix.flavor }} -t ${{ matrix.entrypoint }}

      - name: Build release App Bundle
        run: flutter build appbundle --release --flavor ${{ matrix.flavor }} -t ${{ matrix.entrypoint }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}-${{ needs.version.outputs.tag }}
          path: |
            build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
            build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build release notes from CHANGELOG.md
        if: matrix.flavor == 'production' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          extract_section() {
            local heading="$1"
            awk -v heading="$heading" '
              /^## / {
                if (found) exit
                line = substr($0, 4)
                if (index(line, heading) == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md
          }

          extract_section "$APP_VERSION" > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section for $APP_VERSION, falling back to Unreleased." >&2
            extract_section "Unreleased" > release_notes.md
          fi

          if [ ! -s release_notes.md ]; then
            echo "No changelog content found for $APP_VERSION or Unreleased." >&2
            exit 1
          fi

          {
            cat release_notes.md
            printf '\n\n---\n'
            printf -- '- Version source: `pubspec.yaml`\n'
            printf -- '- Commit: `%s`\n' "$COMMIT_SHA"
            printf -- '- Artifacts: production release APK and Android App Bundle (AAB)\n\n'
            printf 'Development and staging builds are available as workflow artifacts.\n'
          } > release_body.md

          cat release_body.md

      - name: Create GitHub release
        if: matrix.flavor == 'production' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release_body.md
          files: |
            build/app/outputs/flutter-apk/app-production-release.apk
            build/app/outputs/bundle/productionRelease/app-production-release.aab
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
